 const bind=(d,re)=>{d.querySelectorAll("[data-nt]").forEach(b=>b.onclick=()=>{const q=pget();q.nt=b.dataset.nt==="1";st.set("prof:"+P.code,q);re()});d.querySelectorAll("[data-cs]").forEach(b=>b.onclick=()=>{consSet(b.dataset.cs==="1");re()});const i=$$("psc");i.onchange=()=>{P.school=schClean(i.value);i.value=P.school;st.set("profile",P)}};
 sheet("⚙️ Ρυθμίσεις",body,bind,profile)}

  d.innerHTML=`<div class="wc"><button class="wx" id="wx" aria-label="Κλείσιμο">✕</button><h2>Καλώς ήρθες στο Physics in Motion Β΄ 🚀</h2>
  <p>📲 <b>Βάλ' την στην αρχική οθόνη</b>, για να ανοίγει σαν κανονική εφαρμογή.<br>• <b>iPhone:</b> άνοιξε το link στο Safari → κουμπί «Κοινοποίηση» (τετράγωνο με βέλος) → «Προσθήκη στην αρχική οθόνη».<br>• <b>Android:</b> στο Chrome → ⋮ (τρεις τελείες) → «Εγκατάσταση εφαρμογής» ή «Προσθήκη στην αρχική οθόνη».</p>
  <p>🗺️ <b>Αποστολή:</b> λύνεις πίστες, κερδίζεις αστέρια και XP και ξεκλειδώνεις κάρτες και χρώματα.</p>
  <p>🔥 <b>Σερί:</b> παίζε τον ημερήσιο στόχο κάθε μέρα και μετράει πόσες μέρες στη σειρά τα κατάφερες. 🛡️ <b>Πάσο:</b> κάθε εβδομάδα έχεις 1, και σε σώζει αν χάσεις μία μέρα, ώστε να μη σπάσει το σερί. 🔁 <b>Επαναλήψεις:</b> ερωτήσεις που έκανες λάθος και σου ξαναεμφανίζονται λίγες μέρες μετά, για να τις θυμάσαι.</p>
  <p>🏆 <b>Challenge:</b> κάθε Δευτέρα νέο σετ 10 ερωτήσεων, ίδιο για όλους, με χρονόμετρο και 5 προσπάθειες. Στην κατάταξη φαίνεται μόνο το ψευδώνυμό σου.</p>
  <p>🔑 Ο <b>κωδικός</b> σου είναι προσωπικός, μην τον δίνεις σε άλλους. Τα αποτελέσματά σου τα βλέπει μόνο ο δημιουργός της εφαρμογής, για να τη βελτιώνει.</p>
  <p>ℹ️ Τις οδηγίες τις βρίσκεις πάντα στο <b>Προφίλ → Οδηγίες</b>.</p>
  <button class="btn primary" id="wok">Κατάλαβα, πάμε!</button></div>`;
  document.body.appendChild(d);const cl=()=>{d.remove();if(P)st.set("wel:"+P.code,1)};$$("wx").onclick=cl;$$("wok").onclick=cl}
function chBanner(){const m=chM(),r=chRec(m),left=CHAL_TRIES-r.tries;
  if(!chOpen())return `<button class="chb lk" id="ch"><span>🏆</span><div><b>Challenge · σύντομα</b><small>Ξεκινά Δευτέρα ${chDM(chMon(CHAL_START))}</small></div></button>`;
  return `<button class="chb" id="ch"><span>🏆</span><div><b>Challenge της εβδομάδας</b><small>${r.best?"Καλύτερό σου: "+r.best.pts+" πόντοι · ":""}${left>0?left+" προσπάθειες":"Ολοκλήρωσες τις προσπάθειες"}</small></div></button>`}
function chFetch(m){if(!RESULTS_URL)return Promise.resolve(null);
  const u=RESULTS_URL+(RESULTS_URL.indexOf("?")<0?"?":"&")+"action=board&month="+m+"&code="+encodeURIComponent(P.code);
  return Promise.race([fetch(u).then(r=>r.json()),new Promise((_,j)=>setTimeout(j,7000))]).catch(()=>null)}
function chBoard(d){const el=$$("bd");if(!el)return;
  if(!d||!d.top){el.innerHTML=RESULTS_URL?`<p style="color:var(--mute)">Δεν φορτώθηκε η κατάταξη. Έλεγξε τη σύνδεσή σου και ξαναδοκίμασε.</p>`:`<p style="color:var(--mute)">Η κατάταξη θα εμφανιστεί μόλις συνδεθεί η εφαρμογή. Οι πόντοι σου αποθηκεύονται κανονικά.</p>`;return}

  if(d.me&&d.me.rank>10)h+=`<div class="chr me"><i>${d.me.rank}.</i><em>Εσύ</em><b>${d.me.pts}</b><small>από ${d.total}</small></div>`;
  if(d.teams&&d.teams.length)h+=`<h3 style="margin:16px 0 4px">Κατάταξη σχολείων</h3><p style="color:var(--mute);font-size:13px;margin:0 0 4px">Μέσος όρος των 5 καλύτερων κάθε σχολείου (τουλάχιστον 3 παίκτες)</p>`+d.teams.map((t,i)=>`<div class="chr"><i>${chMed(i)}</i><em>${esc(t[0])}</em><b>${t[1]}</b><small>${t[2]} παίκτες</small></div>`).join("");
  el.innerHTML=h+`<p style="color:var(--mute);font-size:13px">${d.total} παίκτες συνολικά</p>`}
function chBadges(){const b=st.get("chb:"+P.code,{}),ks=Object.keys(b).sort();return ks.length?ks.map(k=>chMed(b[k]-1)+" "+chName(k)).join(" · "):""}
function chalScreen(){setBg("okk");const m=chM(),pp=pget(),r=chRec(m),left=CHAL_TRIES-r.tries,n=new Date(),days=Math.max(1,Math.ceil((chMon(m).getTime()+7*864e5-n)/864e5));
  if(!pp.nick)return chNick();
  $.innerHTML=`<div class="top"><button class="ex" id="bk">‹ Αρχική</button><span class="xp">🏆</span></div><h1>Challenge ${chName(m)}</h1>
   <p>Οι ίδιες 10 ερωτήσεις για όλους, ${CHAL_T}″ ανά ερώτηση. Κάθε σωστή με την πρώτη δίνει 100 πόντους και μέχρι 50 μπόνους ταχύτητας. Έχεις ${CHAL_TRIES} προσπάθειες και μετράει η καλύτερη. Νέο σετ κάθε Δευτέρα (σε ${days} ${days===1?"ημέρα":"ημέρες"}).</p>
   <div class="card">Το ψευδώνυμό σου: <b>${esc(pp.nick)}</b> <button class="ex" id="nk">Αλλαγή</button>${r.best?`<br><small>Καλύτερό σου: ${r.best.pts} πόντοι · ${r.best.ok}/10 · ${chFmt(r.best.secs)}</small>`:""}<div id="bgs" style="margin-top:6px">${chBadges()}</div></div>
   <button class="btn primary" id="cp" ${left<=0?"disabled":""}>${left>0?"▶ Παίξε ("+left+(left===1?" προσπάθεια":" προσπάθειες")+")":"Ολοκλήρωσες τις προσπάθειές σου"}</button>
   <h3>Κατάταξη εβδομάδας</h3><div id="bd"><p style="color:var(--mute)">Φόρτωση…</p></div>`;
  $$("bk").onclick=home;$$("nk").onclick=chNick;if(left>0)$$("cp").onclick=chalStart;
  chFetch(m).then(chBoard);
  if(st.get("chbchk:"+P.code,"")!==m){const pm=chPrev();chFetch(pm).then(d=>{if(!d)return;st.set("chbchk:"+P.code,m);if(d.me&&d.me.rank>=1&&d.me.rank<=3){const b=st.get("chb:"+P.code,{});b[pm]=d.me.rank;st.set("chb:"+P.code,b);const e=$$("bgs");if(e)e.innerHTML=chBadges()}})}}
function chNick(){setBg("okk");const A=["Γρήγορο","Λαμπρό","Ατρόμητο","Κοσμικό","Φωτεινό","Ανήσυχο"],B=["Φωτόνιο","Ηλεκτρόνιο","Νετρόνιο","Πρωτόνιο","Κβάντο","Άτομο"],pp=pget();
  const def=pp.nick||A[Math.floor(Math.random()*A.length)]+" "+B[Math.floor(Math.random()*B.length)]+" "+(10+Math.floor(Math.random()*90));
  $.innerHTML=`<div class="top"><button class="ex" id="bk">‹ Πίσω</button><span class="xp">🏆</span></div><h1>Διάλεξε ψευδώνυμο</h1><p>Στην κατάταξη βλέπουν όλοι μόνο το ψευδώνυμο, όχι το όνομά σου. Μην γράψεις το πραγματικό σου όνομα ή επώνυμο.</p><input class="chn" id="ni2" maxlength="24" value="${esc(def)}" autocomplete="off" autocapitalize="off" spellcheck="false"><p id="ne" class="bad"></p><button class="btn primary" id="ok">Αποθήκευση</button>`;
  $$("bk").onclick=pp.nick?chalScreen:home;
  $$("ok").onclick=()=>{const v=$$("ni2").value.replace(/\s+/g," ").trim();if(v.length<3){$$("ne").textContent="Τουλάχιστον 3 χαρακτήρες.";return}if(badNick(v)){$$("ne").textContent="Διάλεξε ένα άλλο ψευδώνυμο, κατάλληλο για όλους.";return}
    const q=pget();q.nick=v.slice(0,24);st.set("prof:"+P.code,q);chalScreen()}}
function chalStart(){const m=chM(),k="chal:"+P.code+":"+m,r=chRec(m);if(r.tries>=CHAL_TRIES)return chalScreen();
  r.tries++;st.set(k,r);const qs=chQs(m);
  start({id:"chal",title:"Challenge "+chName(m),sc:"const",tip:"Διάβασε ξανά τη θεωρία της ενότητας.",qs:qs},qs);
  S.chal={m:m,t0:Date.now()};S.pts=0;S.retry=false;S.tl=CHAL_T;S.left=CHAL_T;S.tqi=-1;quiz()}
function chalFinish(){clearTimer();clearTimeout(S.fto);const c=S.chal,n=S.qs.length,k="chal:"+P.code+":"+c.m,r=chRec(c.m);
  if(S.csecs==null){S.csecs=Math.round((Date.now()-c.t0)/1000);const b=r.best;S.cbet=!b||S.pts>b.pts||(S.pts===b.pts&&S.csecs<b.secs);if(S.cbet){r.best={pts:S.pts,ok:S.ok,secs:S.csecs};st.set(k,r)}
    S.crep=report({type:"challenge",id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:new Date().toISOString(),name:P.name,code:P.code,nick:pget().nick||"",month:c.m,pts:S.pts,ok:S.ok,n:n,secs:S.csecs,v:APPV});sfx.done(S.ok/n>=.9?3:S.ok/n>=.7?2:S.ok/n>=.4?1:0)}
  const best=r.best||{pts:S.pts};
  $.innerHTML=`<h1>Τέλος, ${esc(P.name)}!</h1><div class="big">${S.pts}<small style="font-size:22px;color:var(--mute)"> πόντοι</small></div><p>${S.ok} σωστές από ${n} · ${chFmt(S.csecs)}</p>${S.cbet?`<p class="good">Νέο προσωπικό ρεκόρ της εβδομάδας!</p>`:`<p>Το καλύτερό σου: ${best.pts} πόντοι</p>`}${S.crep?`<p style="color:var(--mute);font-size:14px">${S.crep.replace("στάλθηκε στον καθηγητή","μπήκε στην κατάταξη")}</p>`:""}
   <button class="btn primary" id="bd2">🏆 Δες την κατάταξη</button>${S.wrong.length?`<button class="btn" id="rv">Δες τα λάθη μου (${S.wrong.length})</button>`:""}<button class="btn ghost" id="hm">Αρχική</button>`;
  $$("bd2").onclick=()=>setTimeout(chalScreen,0);if($$("rv"))$$("rv").onclick=()=>review(S.wrong,chalFinish);$$("hm").onclick=home}

/* ---- Συναίνεση για ανώνυμη χρήση σε εκπαιδευτική έρευνα (προαιρετική) ---- */

  $.innerHTML=`<div class="top"><span></span><span class="xp">🔬</span></div><h1>Βοήθησέ μας να βελτιώσουμε την εφαρμογή</h1>

   <p>Θέλουμε επίσης να χρησιμοποιήσουμε τα αποτελέσματα <b>χωρίς το όνομά σου</b>, μόνο με έναν κρυφό αριθμό, σε μια εκπαιδευτική μελέτη. Έτσι θα καταλάβουμε ποιες ερωτήσεις δυσκολεύουν τα παιδιά. Κανείς δεν θα μπορεί να δει ποιος είσαι.</p>
